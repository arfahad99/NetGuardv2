name: Deploy NetGuard to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js and build frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build Angular production
        run: cd frontend && npx ng build --configuration production

      # 3. Copy built frontend to EC2
      - name: Copy frontend build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/npm-dashboard/browser/*"
          target: "/tmp/frontend-build/"
          strip_components: 4

      # 4. Deploy backend + activate frontend on EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Update backend code
            cd ~/NetGuardv2
            # Force git to use the latest main to avoid local conflict failures
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Dump Nginx and pm2 diagnostic logs so we can fetch them via a python simple server
            # We spin up a temp python server on port 9999 so we can grab the Nginx config
            cat /etc/nginx/sites-available/default > /tmp/nginx-config.txt 2>&1 || true
            cat /etc/nginx/sites-available/netguard >> /tmp/nginx-config.txt 2>&1 || true
            pm2 status > /tmp/pm2-status.txt 2>&1 || true
            cd /tmp
            nohup python3 -m http.server 9999 > /dev/null 2>&1 &

            # Install any new Python dependencies
            cd ~/NetGuardv2/backend
            source venv/bin/activate
            pip install -r requirements.txt -q
            
            # Ensure backend listens on 0.0.0.0
            sed -i "s/app.run(debug=True, port=5001)/app.run(debug=True, host='0.0.0.0', port=5001)/" app.py

            # Restart backend and any dev servers
            pm2 restart backend || true
            pm2 restart frontend || true
            pm2 restart all || true

            # Deploy frontend build to Nginx
            sudo mkdir -p /var/www/netguard
            sudo cp -r /tmp/frontend-build/* /var/www/netguard/
            sudo cp -r /tmp/frontend-build/* /var/www/html/
            sudo systemctl restart nginx
            rm -rf /tmp/frontend-build

            echo "✅ Deployment complete!"
