<!-- Cloud Connected Indicator (always visible, non-blocking) -->
<div class="backend-status-indicator" [class.online]="isBackendAvailable" [class.offline]="!isBackendAvailable">
  <i [class]="isBackendAvailable ? 'bi bi-cloud-check-fill' : 'bi bi-cloud-slash-fill'"></i>
  <span>{{ isBackendAvailable ? 'Cloud Connected' : 'Cloud Reconnecting...' }}</span>
</div>
