<div class="graph-container position-relative">
  <div class="graph-header">
    <h4 class="graph-title">{{ getMetricLabel() }}</h4>
    <div class="graph-legend">
      <span class="legend-dot" [style.background]="getMetricColor()"
        [style.boxShadow]="'0 0 10px ' + getMetricColor()"></span>
      <span class="legend-label">Current Trend</span>
    </div>
  </div>

  <div class="graph-wrapper">
    <!-- Beautiful ApexCharts Component -->
    <apx-chart #chart [series]="chartOptions.series" [chart]="chartOptions.chart" [xaxis]="chartOptions.xaxis"
      [yaxis]="chartOptions.yaxis" [dataLabels]="chartOptions.dataLabels" [grid]="chartOptions.grid"
      [stroke]="chartOptions.stroke" [colors]="chartOptions.colors" [fill]="chartOptions.fill"
      [tooltip]="chartOptions.tooltip"></apx-chart>
  </div>

  <!-- Stats Ribbon below the graph -->
  <div class="graph-stats mt-2">
    <div class="stat-item">
      <span class="stat-label">Max</span>
      <span class="stat-value" [style.color]="getMetricColor()">{{ maxValue.toFixed(1) }}</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Min</span>
      <span class="stat-value text-white">{{ minValue.toFixed(1) }}</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Points</span>
      <span class="stat-value text-white">{{ pointsCount }}</span>
    </div>
  </div>
</div>
