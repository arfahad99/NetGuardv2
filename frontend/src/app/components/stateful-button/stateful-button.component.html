<button 
  [@buttonState]="buttonState"
  (click)="handleClick()"
  [disabled]="disabled || buttonState !== 'idle'"
  [class]="'stateful-button ' + className"
  [class.loading]="isLoading"
  [class.success]="isSuccess"
>
  <div class="button-content">
    <!-- Loading Spinner -->
    @if (isLoading) {
      <svg 
        @iconFade
        class="icon spinner"
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M12 3a9 9 0 1 0 9 9" />
      </svg>
    }
    
    <!-- Success Check Icon -->
    @if (isSuccess) {
      <svg 
        @iconFade
        class="icon check"
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
        <path d="M9 12l2 2l4 -4" />
      </svg>
    }
    
    <!-- Button Text -->
    <span class="button-text">
      <ng-content></ng-content>
    </span>
  </div>
</button>
