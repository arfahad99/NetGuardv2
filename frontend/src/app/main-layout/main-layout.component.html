<div class="d-flex">
  <!-- Sidebar -->
  <div class="sidebar" style="width: 280px;">
    <div class="sidebar-brand d-flex align-items-center">
      <div class="d-flex align-items-center justify-content-center rounded-circle me-3" style="width: 45px; height: 45px; background: var(--primary-gradient);">
        <i class="bi bi-hdd-network-fill text-white"></i>
      </div>
      <div>
        <h5 class="mb-0 text-white fw-bold">NPM</h5>
        <small class="text-secondary">Dashboard</small>
      </div>
    </div>
    <nav class="sidebar-nav mt-3">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
        <i class="bi bi-grid-1x2-fill"></i> Dashboard
      </a>
      <a routerLink="/dashboard/devices" routerLinkActive="active" class="nav-link">
        <i class="bi bi-pc-display"></i> Devices
      </a>
      <a routerLink="/dashboard/alerts" routerLinkActive="active" class="nav-link">
        <i class="bi bi-bell-fill"></i> Alerts
      </a>
      <a routerLink="/dashboard/network-health" routerLinkActive="active" class="nav-link">
        <i class="bi bi-heart-pulse-fill"></i> Network Health
      </a>
      <a routerLink="/dashboard/qos-events" routerLinkActive="active" class="nav-link">
        <i class="bi bi-speedometer2"></i> QoS Events
      </a>
      <a routerLink="/dashboard/sessions" routerLinkActive="active" class="nav-link">
        <i class="bi bi-clock-history"></i> Sessions
      </a>

    </nav>
    <div class="mt-auto p-3 border-top" style="border-color: var(--border-color) !important; position: absolute; bottom: 0; width: 100%;">
      <div class="d-flex align-items-center mb-3">
        <div class="rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 35px; height: 35px; background: var(--primary-gradient); flex-shrink: 0;">
          <i class="bi bi-person-fill text-white" style="font-size: 0.9rem;"></i>
        </div>
        <div class="flex-grow-1 text-truncate">
          <div class="text-white fw-semibold" style="font-size: 0.9rem;">{{ username }}</div>
          <small class="text-secondary" style="font-size: 0.75rem;">Administrator</small>
        </div>
      </div>
      <div class="d-flex justify-content-center mb-3">
        <app-theme-toggle></app-theme-toggle>
      </div>
      <button class="btn btn-outline-danger w-100 btn-sm" style="border-radius: 8px; padding: 6px 12px; font-size: 0.875rem;" (click)="signout()">
        <i class="bi bi-box-arrow-right me-1" style="font-size: 0.875rem;"></i>Sign Out
      </button>
    </div>
  </div>
  <!-- Main Content -->
  <div class="main-content flex-grow-1">
    <router-outlet></router-outlet>
  </div>
</div>
