<div class="container-fluid py-4">
  <!-- Page Header -->
  <div class="mb-4">
    <h2 class="mb-1 fw-bold">
      <i class="bi bi-person-plus-fill me-2 text-primary"></i>
      Create New User
    </h2>
    <p class="text-secondary mb-0">Add a new user to the system</p>
  </div>

  <!-- Create Form -->
  <div class="row">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-body p-4">
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <!-- Username -->
            <div class="mb-3">
              <label for="username" class="form-label">
                Username <span class="text-danger">*</span>
              </label>
              <input 
                type="text" 
                class="form-control form-control-dark" 
                id="username"
                formControlName="username"
                [class.is-invalid]="username?.invalid && username?.touched"
                [class.is-valid]="username?.valid && username?.touched"
                placeholder="Enter username">
              <div *ngIf="username?.invalid && username?.touched" class="invalid-feedback">
                <span *ngIf="username?.errors?.['required']">Username is required</span>
                <span *ngIf="username?.errors?.['minlength']">Username must be at least 3 characters</span>
              </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">
                Email <span class="text-danger">*</span>
              </label>
              <input 
                type="email" 
                class="form-control form-control-dark" 
                id="email"
                formControlName="email"
                [class.is-invalid]="email?.invalid && email?.touched"
                [class.is-valid]="email?.valid && email?.touched"
                placeholder="Enter email">
              <div *ngIf="email?.invalid && email?.touched" class="invalid-feedback">
                <span *ngIf="email?.errors?.['required']">Email is required</span>
                <span *ngIf="email?.errors?.['email']">Please enter a valid email</span>
              </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label for="password" class="form-label">
                Password <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <input 
                  [type]="showPassword ? 'text' : 'password'" 
                  class="form-control form-control-dark" 
                  id="password"
                  formControlName="password"
                  [class.is-invalid]="password?.invalid && password?.touched"
                  [class.is-valid]="password?.valid && password?.touched"
                  placeholder="Enter password">
                <button 
                  type="button" 
                  class="input-group-text input-icon toggle-password" 
                  (click)="togglePasswordVisibility()">
                  <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                </button>
              </div>
              <div *ngIf="password?.invalid && password?.touched" class="invalid-feedback d-block">
                <span *ngIf="password?.errors?.['required']">Password is required</span>
                <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
              </div>
            </div>

            <!-- Admin Checkbox -->
            <div class="mb-4">
              <div class="form-check">
                <input 
                  type="checkbox" 
                  class="form-check-input" 
                  id="admin"
                  formControlName="admin">
                <label class="form-check-label" for="admin">
                  <strong>Administrator</strong>
                  <small class="d-block text-secondary">
                    Grant full access to all features and user management
                  </small>
                </label>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex gap-2">
              <button 
                type="submit" 
                class="btn btn-primary"
                [disabled]="submitting || form.invalid">
                <span *ngIf="!submitting">
                  <i class="bi bi-check-circle me-2"></i>
                  Create User
                </span>
                <span *ngIf="submitting">
                  <span class="spinner-border spinner-border-sm me-2"></span>
                  Creating...
                </span>
              </button>
              <button 
                type="button" 
                class="btn btn-secondary"
                (click)="cancel()"
                [disabled]="submitting">
                <i class="bi bi-x-circle me-2"></i>
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
