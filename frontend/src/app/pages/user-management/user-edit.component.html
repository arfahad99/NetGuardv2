<div class="container-fluid py-4">
  <!-- Page Header -->
  <div class="mb-4">
    <h2 class="mb-1 fw-bold">
      <i class="bi bi-pencil-square me-2 text-primary"></i>
      Edit User
    </h2>
    <p class="text-secondary mb-0">Update user information and permissions</p>
  </div>

  <!-- Loading Spinner -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="text-secondary mt-2">Loading user...</p>
  </div>

  <!-- Edit Form -->
  <div *ngIf="!loading" class="row">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-body p-4">
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <!-- Username -->
            <div class="mb-3">
              <label for="username" class="form-label">
                Username <span class="text-danger">*</span>
              </label>
              <input 
                type="text" 
                class="form-control form-control-dark" 
                id="username"
                formControlName="username"
                [class.is-invalid]="username?.invalid && username?.touched"
                [class.is-valid]="username?.valid && username?.touched"
                placeholder="Enter username">
              <div *ngIf="username?.invalid && username?.touched" class="invalid-feedback">
                <span *ngIf="username?.errors?.['required']">Username is required</span>
                <span *ngIf="username?.errors?.['minlength']">Username must be at least 3 characters</span>
              </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">
                Email <span class="text-danger">*</span>
              </label>
              <input 
                type="email" 
                class="form-control form-control-dark" 
                id="email"
                formControlName="email"
                [class.is-invalid]="email?.invalid && email?.touched"
                [class.is-valid]="email?.valid && email?.touched"
                placeholder="Enter email">
              <div *ngIf="email?.invalid && email?.touched" class="invalid-feedback">
                <span *ngIf="email?.errors?.['required']">Email is required</span>
                <span *ngIf="email?.errors?.['email']">Please enter a valid email</span>
              </div>
            </div>

            <!-- Admin Checkbox -->
            <div class="mb-4">
              <div class="form-check">
                <input 
                  type="checkbox" 
                  class="form-check-input" 
                  id="admin"
                  formControlName="admin">
                <label class="form-check-label" for="admin">
                  <strong>Administrator</strong>
                  <small class="d-block text-secondary">
                    Grant full access to all features and user management
                  </small>
                </label>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex gap-2">
              <button 
                type="submit" 
                class="btn btn-primary"
                [disabled]="submitting || form.invalid">
                <span *ngIf="!submitting">
                  <i class="bi bi-check-circle me-2"></i>
                  Save Changes
                </span>
                <span *ngIf="submitting">
                  <span class="spinner-border spinner-border-sm me-2"></span>
                  Saving...
                </span>
              </button>
              <button 
                type="button" 
                class="btn btn-secondary"
                (click)="cancel()"
                [disabled]="submitting">
                <i class="bi bi-x-circle me-2"></i>
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Info Card -->
      <div class="card mt-3">
        <div class="card-body">
          <h6 class="fw-bold mb-2">
            <i class="bi bi-info-circle me-2 text-info"></i>
            Note
          </h6>
          <p class="text-secondary mb-0 small">
            Password cannot be changed from this page. Users must use the "Change Password" feature from their profile.
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
