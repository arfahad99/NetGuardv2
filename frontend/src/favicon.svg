<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#grad)"/>
  
  <!-- Network monitor icon -->
  <rect x="16" y="18" width="32" height="22" rx="2" fill="white" opacity="0.95"/>
  <rect x="18" y="20" width="28" height="16" rx="1" fill="#2a2d3a"/>
  
  <!-- Screen content lines -->
  <line x1="21" y1="24" x2="43" y2="24" stroke="#667eea" stroke-width="1.5"/>
  <line x1="21" y1="28" x2="38" y2="28" stroke="#667eea" stroke-width="1.5"/>
  <line x1="21" y1="32" x2="41" y2="32" stroke="#667eea" stroke-width="1.5"/>
  
  <!-- Monitor stand -->
  <rect x="29" y="40" width="6" height="6" fill="white" opacity="0.95"/>
  <rect x="24" y="46" width="16" height="2" rx="1" fill="white" opacity="0.95"/>
  
  <!-- Status indicator -->
  <circle cx="32" cy="52" r="3" fill="#38ef7d"/>
</svg>
